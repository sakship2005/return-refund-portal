server.port=8081
spring.datasource.url=jdbc:h2:mem:rrpdb
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Demo login accounts. Override with env vars RRP_SECURITY_USER_PASSWORD / RRP_SECURITY_ADMIN_PASSWORD
rrp.security.user-password=user123
rrp.security.admin-password=admin123

# File upload limits for product images and bill receipts
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
