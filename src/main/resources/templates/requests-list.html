<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Return Requests</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div th:replace="~{fragments/navbar :: navbar('requests')}"></div>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 fw-bold m-0" th:text="${admin} ? 'All Return Requests' : 'My Return Requests'">Return Requests</h1>
      <div>
        <a th:href="@{/requests/new}" class="btn btn-primary btn-sm me-2">+ New Request</a>
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm" sec:authorize="hasRole('ADMIN')">Dashboard</a>
      </div>
    </div>

    <!-- Search bar -->
    <div class="card card-custom p-3 mb-4 shadow-sm">
      <form th:action="@{/requests}" method="get" class="d-flex gap-2">
        <input type="text" name="q" th:value="${q}" class="form-control" placeholder="Search order ID or customer">
        <button type="submit" class="btn btn-primary px-4">Search</button>
      </form>
    </div>

    <!-- Table -->
    <div class="card card-custom shadow-sm overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover table-striped mb-0 align-middle">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Product</th>
              <th>Customer</th>
              <th th:if="${admin}">Submitted by</th>
              <th>Status</th>
              <th>Amount</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="r : ${requests}">
              <td><a class="fw-semibold text-decoration-none" th:href="@{/requests/{id}(id=${r.id})}" th:text="${r.orderId}"></a></td>
              <td th:text="${r.product}"></td>
              <td th:text="${r.customerName}"></td>
              <td th:if="${admin}" th:text="${r.createdBy}"></td>
              <td><span class="status-badge" th:classappend="'status-' + ${r.status}" th:text="${r.status}"></span></td>
              <td class="fw-bold" th:text="${r.amount}"></td>
              <td>
                <a class="btn btn-sm btn-outline-secondary"
                   th:if="${admin or r.status.name() == 'REQUESTED'}"
                   th:href="@{/requests/{id}/edit(id=${r.id})}">Edit</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
