<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Request Detail</title></head>
<body>
  <h1>Request Detail</h1>
  <p><b>Order ID:</b> <span th:text="${request.orderId}"></span></p>
  <p><b>Product:</b> <span th:text="${request.product}"></span></p>
  <p><b>Reason:</b> <span th:text="${request.reason}"></span></p>
  <p><b>Amount:</b> <span th:text="${request.amount}"></span></p>
  <p><b>Customer:</b> <span th:text="${request.customerName}"></span></p>
  <p><b>Status:</b> <span th:text="${request.status}"></span></p>
  <a th:href="@{/requests/{id}/edit(id=${request.id})}">Edit request</a>
  <h2>Status workflow</h2>
  <form th:if="${request.status.name() != 'REJECTED' and request.status.name() != 'CLOSED'}"
        th:action="@{/requests/{id}/advance(id=${request.id})}" method="post">
    <label>Changed by: <input type="text" name="actor" required></label>
    <button type="submit">Advance status</button>
  </form>
  <form th:if="${request.status.name() == 'UNDER_REVIEW'}"
        th:action="@{/requests/{id}/reject(id=${request.id})}" method="post">
    <input type="hidden" name="actor" value="agent">
    <button type="submit">Reject request</button>
  </form>
  <h2>Status history</h2>
  <ul>
    <li th:each="entry : ${history}">
      <span th:text="${entry.oldStatus}"></span> -&gt;
      <span th:text="${entry.newStatus}"></span>
      by <span th:text="${entry.changedBy}"></span>
    </li>
  </ul>
  <a href="/requests">Back to list</a>
</body>
</html>
