@"
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">🔄 Return & Refund Portal</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/requests">Requests</a>
        <a class="nav-link" href="/requests/new">+ New Request</a>
        <a class="nav-link" href="/dashboard">Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="container py-2" style="max-width: 800px;">
    <div class="card card-custom p-4 mb-4 shadow-sm">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 fw-bold m-0">Request Detail</h1>
        <div>
          <a class="btn btn-sm btn-outline-primary" th:href="@{/requests/{id}/edit(id=${request.id})}">Edit request</a>
          <a class="btn btn-sm btn-outline-secondary" href="/requests">Back to list</a>
        </div>
      </div>
      <div class="row g-3 py-2">
        <div class="col-md-6"><p><b>Order ID:</b> <span class="badge bg-light text-dark fs-6 border" th:text="${request.orderId}"></span></p></div>
        <div class="col-md-6"><p><b>Product:</b> <span class="fw-medium" th:text="${request.product}"></span></p></div>
        <div class="col-md-6"><p><b>Reason:</b> <span class="text-muted" th:text="${request.reason}"></span></p></div>
        <div class="col-md-6"><p><b>Amount:</b> <span class="fw-bold text-success fs-6" th:text="${request.amount}"></span></p></div>
        <div class="col-md-6"><p><b>Customer:</b> <span class="fw-medium" th:text="${request.customerName}"></span></p></div>
        <div class="col-md-6"><p><b>Status:</b> <span class="status-badge" th:classappend="'status-' + ${request.status}" th:text="${request.status}"></span></p></div>
      </div>

      <hr class="my-4">
      <h3 class="h5 fw-bold mb-3">Change Status</h3>
      <div class="d-flex flex-wrap gap-3">
        <form th:action="@{/requests/{id}/advance(id=${request.id})}" method="post" class="d-inline-flex gap-2"
              th:if="${request.status.name() != 'CLOSED' and request.status.name() != 'REJECTED'}">
          <input type="text" name="actor" class="form-control form-control-sm" placeholder="Your name" required style="width: 160px;">
          <button type="submit" class="btn btn-success btn-sm">Advance status</button>
        </form>
        <form th:action="@{/requests/{id}/reject(id=${request.id})}" method="post" class="d-inline-flex gap-2"
              th:if="${request.status.name() == 'UNDER_REVIEW'}">
          <input type="text" name="actor" class="form-control form-control-sm" placeholder="Your name" required style="width: 160px;">
          <button type="submit" class="btn btn-danger btn-sm">Reject request</button>
        </form>
      </div>

      <hr class="my-4">
      <h3 class="h5 fw-bold mb-3">Status History</h3>
      <ul class="list-group list-group-flush border rounded-3">
        <li class="list-group-item" th:each="h : ${history}"
            th:text="${h.oldStatus} + ' -> ' + ${h.newStatus} + ' by ' + ${h.changedBy}"></li>
      </ul>
    </div>
  </div>
</body>
</html>
"@ | Set-Content -Path src\main\resources\templates\request-detail.html -Encoding UTF8
