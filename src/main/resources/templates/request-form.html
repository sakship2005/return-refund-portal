@"
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Return Request</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">🔄 Return & Refund Portal</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/requests">Requests</a>
        <a class="nav-link active" href="/requests/new">+ New Request</a>
        <a class="nav-link" href="/dashboard">Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="container py-2" style="max-width: 650px;">
    <div class="card card-custom p-4 shadow-sm">
      <h1 class="h4 fw-bold mb-4">New Return Request</h1>
      <form th:action="${request.id == null ? '/requests' : '/requests/' + request.id + '/edit'}" th:object="${request}" method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Order ID: <input type="text" th:field="*{orderId}" class="form-control" required></label>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Product: <input type="text" th:field="*{product}" class="form-control" required></label>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Reason: <input type="text" th:field="*{reason}" class="form-control" required></label>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Amount: <input type="number" step="0.01" th:field="*{amount}" class="form-control" required></label>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Customer Name: <input type="text" th:field="*{customerName}" class="form-control" required></label>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4">Submit</button>
          <a href="/requests" class="btn btn-outline-secondary">Back to list</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
"@ | Set-Content -Path src\main\resources\templates\request-form.html -Encoding UTF8
