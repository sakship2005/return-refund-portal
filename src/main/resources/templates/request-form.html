<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Return Request</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div th:replace="~{fragments/navbar :: navbar('new')}"></div>

  <div class="container py-2" style="max-width: 650px;">
    <div class="card card-custom p-4 shadow-sm">
      <h1 class="h4 fw-bold mb-4" th:text="${request.id == null} ? 'New Return Request' : 'Edit Return Request'">New Return Request</h1>
      <form th:action="${request.id == null} ? @{/requests} : @{/requests/{id}/edit(id=${request.id})}"
            th:object="${request}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="form-label fw-semibold" for="orderId">Order ID</label>
          <input type="text" id="orderId" th:field="*{orderId}" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="product">Product</label>
          <input type="text" id="product" th:field="*{product}" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="reason">Reason</label>
          <input type="text" id="reason" th:field="*{reason}" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="amount">Amount</label>
          <input type="number" step="0.01" id="amount" th:field="*{amount}" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="customerName">Customer Name</label>
          <input type="text" id="customerName" th:field="*{customerName}" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="productImageFile">Product Image (Photo of item / damage)</label>
          <input type="file" id="productImageFile" name="productImageFile" class="form-control" accept="image/*">
          <div class="form-text" th:if="${request.id != null and request.hasProductImage()}">
            Current file: <span class="fw-medium text-primary" th:text="${request.productImageFileName != null ? request.productImageFileName : 'Uploaded'}"></span> (uploading a new file will replace it)
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold" for="billImageFile">Bill / Receipt (Invoice proof)</label>
          <input type="file" id="billImageFile" name="billImageFile" class="form-control" accept="image/*,application/pdf">
          <div class="form-text" th:if="${request.id != null and request.hasBillImage()}">
            Current file: <span class="fw-medium text-primary" th:text="${request.billImageFileName != null ? request.billImageFileName : 'Uploaded'}"></span> (uploading a new file will replace it)
          </div>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4">Submit</button>
          <a th:href="@{/requests}" class="btn btn-outline-secondary">Back to list</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
