<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Return Request Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div th:replace="~{fragments/navbar :: navbar('dashboard')}"></div>

  <div class="container py-2" style="max-width: 800px;">
    <div class="card card-custom p-4 mb-4 shadow-sm">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 fw-bold m-0">Return Request Dashboard</h1>
        <a th:href="@{/requests}" class="btn btn-outline-primary btn-sm">View requests</a>
      </div>

      <div class="alert alert-info py-2 mb-4">
        <p class="m-0">Total refund value processed: <strong class="fs-5 text-primary" th:text="${totalRefund}"></strong></p>
      </div>

      <div class="table-responsive rounded border">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr><th>Status</th><th>Requests</th></tr>
          </thead>
          <tbody>
            <tr th:each="entry : ${counts}">
              <td><span class="status-badge" th:classappend="'status-' + ${entry.key}" th:text="${entry.key}"></span></td>
              <td class="fw-bold fs-6" th:text="${entry.value}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
