<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Return &amp; Refund Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div th:replace="~{fragments/navbar :: navbar('home')}"></div>

  <div class="container py-4">
    <div class="card card-custom p-5 text-center shadow-sm">
      <h1 class="display-6 fw-bold mb-2">Return and Refund Management Portal</h1>
      <p class="lead text-muted mb-1">Welcome, <strong sec:authentication="name">user</strong></p>

      <!-- Customer view -->
      <div sec:authorize="hasRole('USER')">
        <p class="text-muted mb-4">Submit a return request and track its progress.</p>
        <div class="d-flex justify-content-center gap-3">
          <a th:href="@{/requests/new}" class="btn btn-primary btn-lg px-4">+ New Request</a>
          <a th:href="@{/requests}" class="btn btn-outline-primary btn-lg px-4">My Requests</a>
        </div>
      </div>

      <!-- Admin view -->
      <div sec:authorize="hasRole('ADMIN')">
        <p class="text-muted mb-4">Review requests, approve or reject them and process refunds.</p>
        <div class="d-flex justify-content-center gap-3">
          <a th:href="@{/requests}" class="btn btn-primary btn-lg px-4">All Requests</a>
          <a th:href="@{/dashboard}" class="btn btn-outline-primary btn-lg px-4">Dashboard</a>
          <a th:href="@{/requests/new}" class="btn btn-outline-secondary btn-lg px-4">+ New Request</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
