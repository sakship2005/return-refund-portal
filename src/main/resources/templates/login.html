<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Return &amp; Refund Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div class="container py-5" style="max-width: 440px;">
    <div class="text-center mb-4">
      <div class="display-5">🔄</div>
      <h1 class="h3 fw-bold mt-2">Return &amp; Refund Portal</h1>
      <p class="text-muted">Please sign in to continue</p>
    </div>

    <div class="card card-custom p-4 shadow-sm">
      <div class="alert alert-danger py-2" th:if="${param.error}">Invalid username or password.</div>
      <div class="alert alert-success py-2" th:if="${param.logout}">You have been logged out.</div>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">Username</label>
          <input type="text" id="username" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Password</label>
          <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
